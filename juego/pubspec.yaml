name: juego
description: "Práctica 4 - Parte 2: Memoria ESCOM, juego con gestión de archivos (Flutter)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Almacenamiento privado de la app (carpeta de partidas).
  path_provider: ^2.1.4
  # Preferencias: formato de guardado, tema, sonido, etc.
  shared_preferences: ^2.3.2
  # Serialización y lectura de XML.
  xml: ^6.5.0
  # Efectos de sonido.
  audioplayers: ^6.1.0
  # Compartir partidas con otras apps.
  share_plus: ^10.1.0
  path: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sonidos/
